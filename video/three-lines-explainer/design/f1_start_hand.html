<!doctype html><meta charset='utf-8'><style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=JetBrains+Mono:wght@400;500&family=Montserrat:wght@400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden}
body{background:#0A0A0A;position:relative;font-family:Montserrat,sans-serif;color:#A9A296}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse 120% 90% at 30% 40%, transparent 55%, rgba(0,0,0,.55) 100%)}
.stage{position:absolute;inset:0;padding:110px 140px}
.tag{font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.24em;color:#C69B3C;text-transform:uppercase;font-weight:500}
.hand{font-family:Caveat,cursive;color:#EBDAB0}
.serif{font-family:'Cormorant Garamond',serif;color:#EBDAB0}
.mono{font-family:'JetBrains Mono',monospace;letter-spacing:.24em;text-transform:uppercase}
.dim{color:#6E6A61}
.rule{height:1px;background:linear-gradient(90deg,#9C7A2E, #C69B3C 40%, rgba(198,155,60,.12))}
</style><body>
<div class='stage'>
  <div class='tag'>The Start</div>
  <div style='margin-top:210px;display:flex;align-items:baseline;gap:70px'>
    <div>
      <div class='hand' style='font-size:190px;font-weight:600'>$150</div>
      <div class='mono dim' style='font-size:19px;margin-top:6px'>you</div>
    </div>
    <div class='hand' style='font-size:120px;color:#A9A296'>+</div>
    <div>
      <div class='hand' style='font-size:190px;font-weight:600'>$100</div>
      <div class='mono dim' style='font-size:19px;margin-top:6px'>Dennis Fast Start</div>
    </div>
    <div class='hand' style='font-size:120px;color:#A9A296'>=</div>
    <div>
      <div class='hand' style='font-size:230px;font-weight:600;color:#C69B3C'>$250</div>
      <div class='mono' style='font-size:19px;margin-top:6px;color:#C69B3C'>full price of entry</div>
    </div>
  </div>
</div><div class='vignette'></div></body>
